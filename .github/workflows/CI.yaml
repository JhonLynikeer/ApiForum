name: CI

on:
  push:
    branches:
      - '*'

jobs:
  in-docker_test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache de dependências Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Verificar Conexão com MySQL
        run: |
          echo "Aguardando MySQL ficar disponível..."
          until mysqladmin ping -h 127.0.0.1 -P 3306 --silent; do
            echo "MySQL ainda não disponível. Tentando novamente em 5 segundos..."
            sleep 5
          done
          echo "MySQL está disponível."

      - name: Mostrar Bancos de Dados
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"

      - name: Executar testes
        run: mvn -B clean test

      - name: Exibir logs de erro
        if: failure()
        run: cat target/surefire-reports/*.txt
