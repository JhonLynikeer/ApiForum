name: CI

on:
  push:
    branches:
      - '*'

jobs:
  in-docker_test:
    name: Testes automatizados
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5

    steps:
      # Checkout do código
      - uses: actions/checkout@v3

      # Configuração do Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache de dependências Maven
      - name: Cache de dependências Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # Esperar o MySQL iniciar antes dos testes (opcional)
      - name: Wait for MySQL
        run: until mysqladmin ping -h 127.0.0.1 --silent; do echo "Waiting for MySQL..."; sleep 5; done;

      # Executar testes com Maven
      - name: Executar testes
        run: mvn -B clean test

      # Etapa de depuração adicional (caso testes falhem)
      - name: Run tests with debug
        if: failure()
        run: mvn test -X

      # Exibir logs do sistema
      - name: Print environment logs
        if: failure()
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Maven Version:"
          mvn -version
